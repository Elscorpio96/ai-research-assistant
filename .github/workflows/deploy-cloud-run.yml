name: Deploy to Google Cloud Run

# Manual deploy. Set these repository settings first (see docs/DEPLOY.md):
#   Variables: GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
#   Secrets (optional, stored in Secret Manager and referenced by name): see docs/DEPLOY.md
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless auth to Google Cloud via Workload Identity Federation

env:
  SERVICE: litscout
  REPO: litscout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image to Artifact Registry
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --port 8000 \
            --memory 512Mi \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-env-vars "LITSCOUT_DB_PATH=/tmp/litscout.db" \
            --set-secrets "LITSCOUT_ACCESS_PASSWORD=litscout-access-password:latest,LITSCOUT_SECRET_KEY=litscout-secret-key:latest"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl -fsS "$URL/healthz"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
