<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title or 'LitScout' }}{% endblock %} · LitScout</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="logo" href="/"><img src="/static/favicon.svg" alt="" width="28" height="28"><span>LitScout</span></a>
  <nav>
    <a href="/">Projects</a>
    <a href="/api/docs">API</a>
    {% if auth %}<form method="post" action="/logout"><button class="linkish">Sign out</button></form>{% endif %}
  </nav>
</header>
<main class="wrap">
  {% if msg %}<div class="flash" role="status">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="foot">LitScout {{ version }} · Search results come from OpenAlex, arXiv and Crossref. Always verify drafts against the original papers.</footer>
</body>
</html>
