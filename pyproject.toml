[project]
name = "litscout"
version = "1.1.0"
description = "AI-assisted literature search, screening and review drafting with verifiable citations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Walid Bello Yakubu" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "defusedxml>=0.7",
  "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
litscout = "litscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
